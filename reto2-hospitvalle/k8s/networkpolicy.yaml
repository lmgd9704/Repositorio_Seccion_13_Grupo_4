# Reto 2c - NetworkPolicy: solo DNS y pg-uci
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-uci-egress
  namespace: hospitvalle
spec:
  podSelector:
    matchLabels:
      app: app-uci
  policyTypes: ["Egress"]
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
  - to:
    - podSelector:
        matchLabels:
          app: pg-uci
    ports:
    - protocol: TCP
      port: 5432
