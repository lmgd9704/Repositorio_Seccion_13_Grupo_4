# Reto 2c - RBAC minimo privilegio
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-uci-sa
  namespace: hospitvalle
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-uci-role
  namespace: hospitvalle
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-uci-binding
  namespace: hospitvalle
subjects:
- kind: ServiceAccount
  name: app-uci-sa
  namespace: hospitvalle
roleRef:
  kind: Role
  name: app-uci-role
  apiGroup: rbac.authorization.k8s.io
