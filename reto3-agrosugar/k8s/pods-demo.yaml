# Pods de demostracion para la matriz (solo laboratorio)
apiVersion: v1
kind: Pod
metadata:
  name: sensor
  namespace: agrosugar
  labels:
    app: sensor
spec:
  containers:
  - name: sensor
    image: busybox:1.36
    command: ["sleep", "3600"]
