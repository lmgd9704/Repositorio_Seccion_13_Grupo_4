# Politica 3 - sensor-to-broker (MQTT 1883)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sensor-to-broker
  namespace: agrosugar
spec:
  podSelector:
    matchLabels:
      app: broker
  policyTypes: ["Ingress"]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: sensor
    ports:
    - protocol: TCP
      port: 1883
