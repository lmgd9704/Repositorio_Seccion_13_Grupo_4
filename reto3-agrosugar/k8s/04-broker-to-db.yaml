# Politica 4 - broker-to-db (Postgres 5432)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: broker-to-db
  namespace: agrosugar
spec:
  podSelector:
    matchLabels:
      app: broker
  policyTypes: ["Egress"]
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: db
    ports:
    - protocol: TCP
      port: 5432
